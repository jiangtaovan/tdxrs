name: Publish to PyPI

on:
  push:
    tags: ["v*.*.*"]

jobs:
  # ── 自动创建 GitHub Release ──
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Extract version from tag
        id: version
        run: echo "version=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT
      - name: Extract changelog for this version
        id: changelog
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          # 从 CHANGELOG.md 提取当前版本的说明 (匹配 "## vX.Y.Z" 到下一个 "## " 之间)
          # [^0-9] 防止前缀误匹配 (如 v0.6.1 匹配到 v0.6.10 段落)
          NOTES=$(sed -n "/^## v${VERSION}[^0-9]/,/^## v/{/^## v${VERSION}[^0-9]/p;/^## v/!p;}" docs/public/CHANGELOG.md | tail -n +2 | head -n -1)
          # 如果没有匹配到，使用默认说明 (printf 解释 \n, echo 会输出字面量)
          if [ -z "$NOTES" ]; then
            printf 'Release v%s\n\nSee [CHANGELOG](docs/public/CHANGELOG.md) for details.\n' "$VERSION" > /tmp/release_notes.md
          else
            printf '%s\n' "$NOTES" > /tmp/release_notes.md
          fi
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: v${{ steps.version.outputs.version }}
          body_path: /tmp/release_notes.md
          draft: false
          prerelease: false

  # ── 多平台构建 + 发布到 PyPI ──
  linux:
    needs: release
    permissions:
      contents: write
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: [x86_64]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Build wheel
        uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.target }}
          args: --release --out dist
      - name: Build sdist (only x86_64)
        if: matrix.target == 'x86_64'
        run: pip install maturin && maturin sdist --out dist
      - name: Upload to PyPI
        run: pip install twine && twine upload --skip-existing dist/*
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.PYPI_TOKEN }}
      - name: Attach wheels to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*

  macos:
    needs: release
    permissions:
      contents: write
    runs-on: macos-latest
    strategy:
      matrix:
        target: [x86_64, aarch64]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Build wheel
        uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.target }}
          args: --release --out dist
      - name: Upload to PyPI
        run: pip install twine && twine upload --skip-existing dist/*
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.PYPI_TOKEN }}
      - name: Attach wheels to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*

  windows:
    needs: release
    permissions:
      contents: write
    runs-on: windows-latest
    strategy:
      matrix:
        target: [x64]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Build wheel
        uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.target }}
          args: --release --out dist
      - name: Upload to PyPI
        run: pip install twine && twine upload --skip-existing dist/*
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.PYPI_TOKEN }}
      - name: Attach wheels to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
